<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Quieres ser mi San Valentín? </title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffb6c1, #ffd1dc);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }.card {
  background: white;
  padding: 28px 24px 32px;
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  text-align: center;
  max-width: 360px;
  width: 90%;
  animation: pop 0.5s ease;
}

@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

h1 {
  font-size: 1.6rem;
  margin-bottom: 18px;
  color: #ff4d6d;
}

p {
  font-size: 1rem;
  margin-bottom: 20px;
  color: #555;
}

.buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: center;
}

button {
  border: none;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, font-size 0.2s ease;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
  box-shadow: 0 6px 16px rgba(255,77,109,0.35);
}

#noBtn {
  background: #eee;
  color: #666;
}

button:hover {
  transform: scale(1.05);
}

.victory {
  font-size: 1.2rem;
  color: #ff4d6d;
  margin-top: 10px;
  animation: pop 0.6s ease;
}

  </style>
</head>
<body>  <div class="card" id="card">
    <h1 id="question">¿Quieres ser mi San Valentín? </h1>
    <p id="subtitle">Prometo muchos momentos lindos </p><div class="buttons" id="buttons">
  <button id="yesBtn">Si</button>
  <button id="noBtn">No</button>
</div>

  </div>  <script>
    let noClicks = 0;

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const question = document.getElementById("question");
    const subtitle = document.getElementById("subtitle");
    const buttons = document.getElementById("buttons");

    yesBtn.addEventListener("click", () => {
      question.textContent = "¡SÍII!";
      subtitle.innerHTML = "TE AMO, ESPERO CON ANSÍAS EL 14";
      buttons.innerHTML = '<div class="victory">TE AMO, ESPERO CON ANSÍAS EL 14</div>';
    });

    noBtn.addEventListener("click", () => {
      noClicks++;

      // Repetir la pregunta
      question.textContent = "¿Segura que no quieres ser mi San Valentín?";

      // Hacer el NO más pequeño
      const noScale = Math.max(0.4, 1 - noClicks * 0.15);
      noBtn.style.transform = `scale(${noScale})`;

      // Hacer el SÍ más grande
      const yesScale = 1 + noClicks * 0.2;
      yesBtn.style.transform = `scale(${yesScale})`;

      // Cambiar texto del NO con el tiempo
      const frasesNo = [
        "No",
        "¿Segura?",
        "Piénsalo bien",
        "Anda, di que sí",
        "Última oportunidad"
      ];

      noBtn.textContent = frasesNo[Math.min(noClicks, frasesNo.length - 1)];
    });
  </script></body>
  </html>
